<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bayan Alatiat — Cybersecurity Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #120f12;
            --bg-card: #1a151a;
            --bg-elevated: #231c23;
            --border-subtle: #332732;
            --text-white: #fdf7fa;
            --text-muted: #b8a3b2;
            --accent: #f4a4c0;       /* Soft Rose Pink */
            --accent-warm: #f8c4d6;  /* Pastel Blush */
            --accent-glow: rgba(244, 164, 192, 0.14);
            --accent-border: rgba(244, 164, 192, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-white);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Top Navigation Bar */
        nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: rgba(18, 15, 18, 0.88);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-subtle);
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-box {
            width: 36px;
            height: 36px;
            background-color: var(--bg-elevated);
            border: 1px solid var(--accent-border);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            font-weight: 800;
            font-size: 1.1rem;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: var(--accent);
        }

        .github-top {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            font-family: 'JetBrains Mono', monospace;
            transition: color 0.2s;
        }

        .github-top:hover {
            color: var(--accent);
        }

        /* Container */
        .container {
            max-width: 1120px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        /* Hero Section */
        .hero {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 3rem;
            align-items: center;
            padding: 5.5rem 0;
            border-bottom: 1px solid var(--border-subtle);
        }

        .role-tag {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--accent);
            font-size: 0.78rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 1.2rem;
        }

        .role-dot {
            width: 7px;
            height: 7px;
            background-color: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent);
        }

        .hero h1 {
            font-size: 4.2rem;
            font-weight: 800;
            line-height: 1.05;
            letter-spacing: -2px;
            margin-bottom: 1.5rem;
        }

        .hero h1 span {
            color: var(--accent);
            display: block;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1.1rem;
            max-width: 480px;
            margin-bottom: 2.2rem;
        }

        .hero-btns {
            display: flex;
            gap: 1rem;
            margin-bottom: 2.5rem;
        }

        .btn-primary {
            background-color: var(--accent);
            color: #180d14;
            padding: 0.85rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn-primary:hover {
            background-color: var(--accent-warm);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: var(--bg-card);
            color: var(--text-white);
            border: 1px solid var(--border-subtle);
            padding: 0.85rem 1.5rem;
            border-radius: 8px;
            font-weight: 500;
            font-size: 0.95rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: border-color 0.2s;
        }

        .btn-secondary:hover {
            border-color: var(--accent);
        }

        .location {
            color: var(--text-muted);
            font-size: 0.82rem;
        }

        /* Hero Right Radial Preview Circle */
        .hero-visual-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .radial-circle {
            width: 390px;
            height: 390px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(244, 164, 192, 0.16) 0%, rgba(18, 15, 18, 0.4) 70%);
            border: 1px solid var(--accent-border);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .mockup-card {
            width: 330px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 1.1rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.55);
        }

        .mockup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 0.7rem;
            border-bottom: 1px solid var(--border-subtle);
            margin-bottom: 0.8rem;
            font-size: 0.75rem;
        }

        .mockup-badge {
            background-color: var(--accent);
            color: #180d14;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            margin-right: 6px;
        }

        .mockup-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 0.3rem;
        }

        .progress-bar {
            display: flex;
            gap: 4px;
            margin: 0.7rem 0;
        }

        .progress-step {
            height: 4px;
            flex: 1;
            background-color: var(--accent);
            border-radius: 2px;
        }

        .progress-step.dim {
            background-color: var(--border-subtle);
        }

        .mockup-row {
            background-color: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            padding: 0.5rem 0.7rem;
            border-radius: 6px;
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-top: 0.45rem;
            display: flex;
            justify-content: space-between;
        }

        .preview-caption {
            margin-top: 1rem;
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .preview-caption span {
            color: var(--accent);
        }

        /* Section Titles */
        .section-block {
            padding: 5rem 0;
            border-bottom: 1px solid var(--border-subtle);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 3rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .big-heading {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -1.5px;
            line-height: 1.1;
        }

        .big-heading span {
            color: var(--accent);
        }

        .section-sub {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Featured Wide Card (Project 1) */
        .featured-project {
            background-color: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            overflow: hidden;
            margin-bottom: 2rem;
            transition: border-color 0.25s;
        }

        .featured-project:hover {
            border-color: var(--accent-border);
        }

        .project-preview-pane {
            background: radial-gradient(circle at center, rgba(244, 164, 192, 0.12) 0%, var(--bg-elevated) 100%);
            padding: 2.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-right: 1px solid var(--border-subtle);
        }

        .project-details-pane {
            padding: 2.8rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .category-label {
            color: var(--accent);
            font-size: 0.75rem;
